name: Build & Deploy

on:
  push:
    branches:
      - new-design

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: client

      - name: Build
        run: npm run build
        working-directory: client

      # The site must land in public_html. Hostinger FTP logins open either one level above it
      # (next to DO_NOT_UPLOAD_HERE) or inside it — check which, and upload to the right place.
      - name: Find the website folder
        id: target
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          listing=$(curl -s --ssl-reqd -k --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://$FTP_SERVER/")
          echo "FTP login folder contains:"; echo "$listing"
          if echo "$listing" | grep -qx 'public_html'; then dir=./public_html/; else dir=./; fi
          echo "Uploading to: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          security: loose
          local-dir: client/dist/
          server-dir: ${{ steps.target.outputs.dir }}
